<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Longlong Li | PhD Researcher | Chonnam National University</title>
    <meta
      name="description"
      content="Engineered Heart Tissue, Cardiac Organ-on-Chip and Electromechanical Biosensing."
    />
    <meta name="theme-color" content="#f7fbff" />
    <link rel="canonical" href="https://longlongli.com/connect/" />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Longlong Li — Academic Profile" />
    <meta
      property="og:description"
      content="PhD Researcher at Chonnam National University working on engineered cardiac tissue and electromechanical biosensing."
    />
    <meta property="og:url" content="https://longlongli.com/connect/" />
    <meta property="og:image" content="https://longlongli.com/assets/Longlong.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Longlong Li — Academic Profile" />
    <meta
      name="twitter:description"
      content="Engineered Heart Tissue, Cardiac Organ-on-Chip and Electromechanical Biosensing."
    />
    <meta name="twitter:image" content="https://longlongli.com/assets/Longlong.jpg" />
    <link rel="preload" href="/assets/profile-connect.webp" as="image" />
    <link rel="stylesheet" href="./connect.css" />
    <script src="./profile-config.js" defer></script>
    <script src="./connect.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <article class="digital-card" aria-labelledby="profile-name">
        <header class="profile-header">
          <div class="portrait-wrap" data-portrait-wrap>
            <img class="portrait" data-profile-image src="" alt="" width="104" height="104" />
            <span class="portrait-fallback" aria-hidden="true">LL</span>
          </div>
          <div class="identity">
            <p class="eyebrow">Academic profile</p>
            <h1 id="profile-name" data-name>Longlong Li</h1>
            <p class="role" data-title>PhD Researcher</p>
            <p class="institution" data-institution>Chonnam National University</p>
          </div>
        </header>

        <section class="research-summary" aria-labelledby="research-heading">
          <h2 id="research-heading" class="sr-only">Research profile</h2>
          <p class="research-areas" data-research-areas></p>
          <p class="research-statement" data-research-statement></p>
        </section>

        <section class="primary-actions" aria-label="Primary contact actions">
          <button class="button button-primary" type="button" data-save-contact>
            <img src="./icons/download.svg" alt="" aria-hidden="true" />
            <span>Save Contact</span>
          </button>
          <a class="button button-secondary" data-link="linkedin" href="#">
            <img src="./icons/brand-linkedin.svg" alt="" aria-hidden="true" />
            <span>LinkedIn</span>
          </a>
        </section>
        <p class="action-status" role="status" aria-live="polite" data-action-status></p>

        <nav class="contact-grid" aria-label="Academic and contact profiles">
          <a class="contact-link" data-link="email" href="#">
            <span class="contact-icon"><img src="./icons/mail.svg" alt="" aria-hidden="true" /></span>
            <span>Email</span>
          </a>
          <a class="contact-link" data-link="website" href="#">
            <span class="contact-icon"><img src="./icons/world.svg" alt="" aria-hidden="true" /></span>
            <span>Website</span>
          </a>
          <a class="contact-link" data-link="scholar" href="#">
            <span class="contact-icon"><img src="./icons/school.svg" alt="" aria-hidden="true" /></span>
            <span>Scholar</span>
          </a>
          <a class="contact-link contact-link-orcid" data-link="orcid" href="#">
            <span class="contact-icon"><img src="./icons/id.svg" alt="" aria-hidden="true" /></span>
            <span>ORCID</span>
          </a>
        </nav>

        <section class="conference-card" aria-labelledby="conference-heading">
          <div class="conference-copy">
            <div class="conference-kicker">
              <img src="./icons/presentation.svg" alt="" aria-hidden="true" />
              <h2 id="conference-heading" data-conference-name>MicroTAS 2026</h2>
              <span class="conference-type" data-conference-type>Poster</span>
            </div>
            <p class="poster-title" data-poster-title></p>
            <a class="poster-link" data-poster-link href="#">
              <span>View Poster</span>
              <img src="./icons/arrow-up-right.svg" alt="" aria-hidden="true" />
            </a>
          </div>
          <div class="poster-visual" data-poster-visual>
            <img data-poster-thumbnail src="" alt="" width="991" height="1400" loading="lazy" />
          </div>
        </section>

        <section class="interest-card" aria-labelledby="interests-heading">
          <div class="section-heading">
            <img src="./icons/flask-2.svg" alt="" aria-hidden="true" />
            <h2 id="interests-heading">Research Interests</h2>
          </div>
          <ul class="interest-tags" data-interest-tags></ul>
        </section>

        <footer class="card-footer">
          <img src="./icons/message-circle.svg" alt="" aria-hidden="true" />
          <p data-footer-message></p>
        </footer>
      </article>
    </main>

    <noscript>
      <p class="noscript-message">JavaScript is required to load the contact links and Save Contact file.</p>
    </noscript>
  </body>
</html>
